---
# ZUSATZMATERIAL (Branch additional-material): alle TODOs sind ausgefuellt, die optionalen Beispiele sind aktiv.
# Beispiele mit [NICHT AKTIV] bleiben bewusst auskommentiert, der Grund steht dabei.
# Optional in dieser Datei: listen, flush_handlers.
# handlers/main.yml: Handler der Rolle. Sie laufen nur, wenn eine Aufgabe sie per notify ruft, und
# einmal am Ende. Wozu: Dienst nur neu laden, wenn sich die Konfiguration geaendert hat.
# Der Name muss genau dem notify in tasks/main.yml entsprechen. Die Rolle ruft den Handler also nicht
# selbst, sondern die Aufgabe, die etwas geaendert hat.
- name: Nginx neu laden
  ansible.builtin.service:
    name: nginx
    state: reloaded
  # OPTIONAL: mehrere Handler auf dasselbe Stichwort (in den Handler schreiben)
  listen: "web neu laden"
# OPTIONAL: Handler sofort ausfuehren, in tasks/main.yml:
# Aktiv: meta: flush_handlers steht in tasks/main.yml nach dem Start des Dienstes.
