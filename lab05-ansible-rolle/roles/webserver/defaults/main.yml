---
# defaults/main.yml: Vorgabewerte der Rolle. Sie haben die niedrigste Rangfolge, jeder andere Ort
# (Inventory, Play, -e) ueberschreibt sie. So bleibt die Rolle anpassbar, ohne sie zu aendern.
# Standardwerte, im Playbook oder Inventory ueberschreibbar
# Genutzt werden sie in tasks/main.yml und in den Vorlagen (index.html.j2: webserver_begruessung,
# site.conf.j2: webserver_port). Rangfolge von niedrig nach hoch: defaults, Inventory, vars in site.yml, -e.
# Beispiel: ansible-playbook site.yml -e webserver_port=8081 gewinnt gegen alles andere.
webserver_port: 80
webserver_begruessung: "Hallo TLBG"
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
# GELOESTE VERSION von practice: alle TODOs sind ausgefuellt, die optionalen Beispiele sind aktiv.
# Beispiele mit [NICHT AKTIV] bleiben bewusst auskommentiert, der Grund steht dabei.
# Optional in dieser Datei: weitere Standardwerte, argument_specs, meta/main.yml.
# defaults/ hat die niedrigste Rangfolge, vars/ ueberschreibt fast alles.
# OPTIONAL: weitere Standardwerte
webserver_pakete: [wget]
webserver_dokumentenwurzel: /var/www/html
# OPTIONAL: Eingaben der Rolle beschreiben und pruefen, in roles/webserver/meta/argument_specs.yml:
# Aktiv: siehe meta/argument_specs.yml
# OPTIONAL: Abhaengigkeiten und Metadaten in roles/webserver/meta/main.yml:
# Aktiv: siehe meta/main.yml
