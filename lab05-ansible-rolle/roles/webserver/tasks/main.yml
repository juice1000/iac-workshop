---
# ROLLE
# Was: eine wiederverwendbare Sammlung von Aufgaben in fester Ordnerstruktur:
#   tasks/main.yml     die Aufgaben (diese Datei, ohne Play-Kopf, nur die Liste)
#   defaults/main.yml  Standardwerte der Variablen, leicht ueberschreibbar
#   handlers/main.yml  Handler zu den Aufgaben
#   templates/         Jinja2-Vorlagen, mit src: ohne Pfad ansprechbar
#   meta/main.yml      Metadaten und Abhaengigkeiten (optional)
# Wozu: dieselbe Einrichtung in mehreren Projekten nutzen. Das Playbook (site.yml) ruft nur noch
#       die Rolle auf. Variablen der Rolle beginnen mit dem Rollennamen (webserver_...).
# Lab 5: die Aufgaben aus Lab 3 als Rolle (Uebung)
# Die Vorlagen liegen in templates/ (ohne Pfadpraefix), die Variablen heissen webserver_*.
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
- name: Nginx installieren
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  # OPTIONAL: Stichwort, damit nur dieser Teil laeuft:  ansible-playbook site.yml --tags paket
  #   tags: [paket]

- name: Startseite aus Vorlage erzeugen
  ansible.builtin.template:
    src: index.html.j2
    # TODO: dest /var/www/html/index.html, Besitzer root, Gruppe root, Rechte 0644

- name: Nginx-Konfiguration aus Vorlage erzeugen
  ansible.builtin.template:
    src: site.conf.j2
    # TODO: dest /etc/nginx/sites-available/default, Besitzer root, Gruppe root, Rechte 0644
  # TODO: notify "Nginx neu laden"
  # Hinweis: validate: "nginx -t -c %s" funktioniert nur bei einer kompletten nginx.conf,
  # nicht bei diesem Ausschnitt. Beispiel mit sudoers:  validate: "visudo -cf %s"

