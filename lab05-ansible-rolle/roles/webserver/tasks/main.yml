---
- name: Nginx installieren
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Startseite aus Vorlage erzeugen
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Nginx-Konfiguration aus Vorlage erzeugen
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Nginx neu laden

- name: Nginx laeuft und startet beim Booten
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
