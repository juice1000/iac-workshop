---
# ROLLE
# Was: eine wiederverwendbare Sammlung von Aufgaben in fester Ordnerstruktur:
#   tasks/main.yml     die Aufgaben (diese Datei, ohne Play-Kopf, nur die Liste)
#   defaults/main.yml  Standardwerte der Variablen, leicht ueberschreibbar
#   handlers/main.yml  Handler zu den Aufgaben
#   templates/         Jinja2-Vorlagen, mit src: ohne Pfad ansprechbar
#   meta/main.yml      Metadaten und Abhaengigkeiten (optional)
# Wozu: dieselbe Einrichtung in mehreren Projekten nutzen. Das Playbook (site.yml) ruft nur noch
#       die Rolle auf. Variablen der Rolle beginnen mit dem Rollennamen (webserver_...).
# Woher kommt was:
#   Server (hosts)   site.yml waehlt die Gruppe web aus dem Inventory (ansible.cfg verweist auf Lab 3)
#   Variablen        defaults/main.yml gibt Standardwerte vor, site.yml kann sie unter vars: ueberschreiben
#   Vorlagen         roles/webserver/templates/, src: braucht keinen Pfad
#   Handler          roles/webserver/handlers/main.yml, notify nennt ihn beim Namen
# Die Aufgaben sind dieselben wie in Lab 3, in derselben Reihenfolge: erst installieren, dann die Dateien,
# dann den Dienst. Neu ist nur, dass Play-Kopf und vars fehlen. Die stehen jetzt in site.yml und defaults/.
# Lab 5: die Aufgaben aus Lab 3 als Rolle (Uebung)
# Die Vorlagen liegen in templates/ (ohne Pfadpraefix), die Variablen heissen webserver_*.
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
# ZUSATZMATERIAL (Branch additional-material): alle TODOs sind ausgefuellt, die optionalen Beispiele sind aktiv.
# Beispiele mit [NICHT AKTIV] bleiben bewusst auskommentiert, der Grund steht dabei.
# Optional in dieser Datei: tags, Hinweis zu validate, include_tasks/import_tasks, loop und when,
#   Befehle.
# Das Paket kommt aus den apt-Quellen des Servers. become: true steht nicht hier, sondern in site.yml
# und gilt fuer alle Aufgaben der Rolle.
- name: Nginx installieren
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  # OPTIONAL: Stichwort, damit nur dieser Teil laeuft:  ansible-playbook site.yml --tags paket
  tags: [paket]

# src: index.html.j2 wird in roles/webserver/templates/ gesucht. Darin steht {{ webserver_begruessung }}.
# Der Wert kommt aus defaults/main.yml ("Hallo TLBG"), site.yml ueberschreibt ihn mit "Hallo aus der Rolle".
- name: Startseite aus Vorlage erzeugen
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

# site.conf.j2 setzt den Port aus webserver_port (Standard 80 aus defaults/main.yml).
# notify ruft den Handler aus handlers/main.yml, aber nur, wenn sich die Datei geaendert hat.
- name: Nginx-Konfiguration aus Vorlage erzeugen
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Nginx neu laden
  # Hinweis: validate: "nginx -t -c %s" funktioniert nur bei einer kompletten nginx.conf,
  # nicht bei diesem Ausschnitt. Beispiel mit sudoers:  validate: "visudo -cf %s"

# Nach der Konfiguration, damit nginx gleich mit den richtigen Einstellungen startet.
- name: Nginx laeuft und startet beim Booten
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

# Handler sofort ausfuehren (hier nach dem Start, sonst waere nginx beim ersten Lauf noch nicht aktiv)
- name: Handler jetzt ausfuehren
  ansible.builtin.meta: flush_handlers

# OPTIONAL: Aufgaben in Dateien aufteilen und einbinden
- name: Zusatzpakete (eigene Datei, dynamisch eingebunden)
  ansible.builtin.include_tasks: zusatz.yml
  tags: [paket]

- name: Abschluss (eigene Datei, statisch eingebunden)
  ansible.builtin.import_tasks: abschluss.yml
  tags: [konfig]
# OPTIONAL: Aufgabe nur unter einer Bedingung oder in einer Schleife
- name: Zusaetzliches Paket
  ansible.builtin.apt:
    name: "{{ item }}"
  loop: "{{ webserver_pakete | default([]) }}"
  when: webserver_pakete is defined
# OPTIONAL: Befehle
#   ansible-galaxy init meine_rolle      # Geruest fuer eine neue Rolle
#   ansible-lint                         # Stil und Fallstricke
#   molecule test                        # Rolle automatisch in Containern testen
