# ansible.cfg: Einstellungen fuer Ansible (gilt fuer Aufrufe aus diesem Ordner).
[defaults]
# Dasselbe Inventory wie in Lab 3, also dieselben Server. Der Pfad ist relativ zu diesem Ordner.
inventory = ../lab03-ansible-grundlagen/inventory.ini
# Wo Ansible nach Rollen sucht. Wozu: "- role: webserver" im Playbook findet roles/webserver.
roles_path = roles
# Kein Rueckfragen beim ersten SSH-Kontakt. Nur fuer das Labor sinnvoll.
host_key_checking = False
# Python auf dem Zielserver selbst finden, ohne Warnung.
interpreter_python = auto_silent
# Ausgabe von Aufgaben als lesbares YAML.
callback_result_format = yaml
