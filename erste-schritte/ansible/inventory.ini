# Inventory: die Liste der Server, die Ansible verwaltet. Hier nur der eigene Rechner, ganz ohne SSH.
# [lokal] ist eine Gruppe. Im Playbook waehlt "hosts: lokal" alle Server dieser Gruppe.
# ansible_connection=local fuehrt die Module direkt hier aus.
# ansible_python_interpreter: dasselbe Python, mit dem Ansible selbst laeuft.
[lokal]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
