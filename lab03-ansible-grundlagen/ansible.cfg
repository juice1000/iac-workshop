# ansible.cfg: Einstellungen fuer Ansible. Ansible sucht sie zuerst im aktuellen Ordner,
# deshalb ruft man ansible und ansible-playbook aus diesem Ordner auf.
[defaults]
# Welche Server verwaltet werden (Inventory). Spart die Option -i bei jedem Aufruf.
inventory = inventory.ini
# Kein Rueckfragen beim ersten SSH-Kontakt ("Are you sure you want to continue connecting?").
# Nur fuer das Labor sinnvoll. Die Container bekommen bei jedem apply neue Host-Keys.
host_key_checking = False
# Python auf dem Zielserver selbst finden, ohne Warnung. Wozu: Module laufen in Python auf dem Server.
interpreter_python = auto_silent
# Ausgabe von Aufgaben als lesbares YAML statt einer langen JSON-Zeile.
callback_result_format = yaml
