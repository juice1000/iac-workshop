# Lab 3: Webserver einrichten (Uebung)
# Ziel: nginx auf der Gruppe web, Startseite und Konfiguration aus den Vorlagen in templates/
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
- name: Webserver einrichten
  hosts: web
  become: true

  vars:
    web_port: 80
    begruessung: "Hallo TLBG"
  # OPTIONAL: Variablen aus Datei oder Eingabe
