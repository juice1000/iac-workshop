      ansible.builtin.template:
        src: templates/index.html.j2
        # TODO: dest /var/www/html/index.html
        owner: root
        group: root
        # TODO: mode "0644"

    # OPTIONAL: Datei vor dem Ausrollen pruefen (validate), Beispiel sudoers
