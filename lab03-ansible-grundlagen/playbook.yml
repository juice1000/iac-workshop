---
# Lab 3: Webserver einrichten
# Ziel: nginx auf der Gruppe web, Startseite und Konfiguration aus den Vorlagen in templates/
# PLAY
# Was: ein Abschnitt im Playbook. Er sagt, AUF WELCHEN Servern (hosts) WAS (tasks) passieren soll.
#      Ein Playbook ist eine Liste von Plays. Die Datei ist YAML, Einrueckung zaehlt.
# hosts:  Gruppe aus dem Inventory (hier web).
# become: true = mit sudo ausfuehren. Wozu: Pakete installieren braucht Root-Rechte.
- name: Webserver einrichten
  hosts: web
  become: true

  # vars: Variablen fuer dieses Play, nutzbar mit {{ name }} in Aufgaben und Vorlagen.
  #       Mit -e web_port=8081 auf der Kommandozeile ueberschreibbar (hat Vorrang).
  vars:
    web_port: 80
    begruessung: "Hallo TLBG"

  # tasks: die Aufgaben, die der Reihe nach laufen. Jede Aufgabe ruft ein Modul auf.
  # Ein Modul ist ein fertiger Baustein (apt, template, service ...) mit eigenen Parametern.
  # Module sind idempotent: sie pruefen den Ist-Zustand und aendern nur, wenn er abweicht.
  # Hilfe zu jedem Modul: ansible-doc ansible.builtin.apt
  tasks:
    # apt: installiert Pakete (Debian/Ubuntu). state: present = soll vorhanden sein.
    #      cache_valid_time: Paketliste nur aktualisieren, wenn sie aelter als eine Stunde ist.
    - name: Nginx installieren
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    # template: rendert eine Jinja2-Vorlage (*.j2) auf dem Controller und legt das Ergebnis auf dem Server ab.
    #           Wozu: Konfigurationsdateien mit Variablen. Unterschied zu copy: copy kopiert 1:1.
    #           owner, group, mode setzen Besitzer und Rechte.
    - name: Startseite aus Vorlage erzeugen
      ansible.builtin.template:
        src: templates/index.html.j2
        # TODO: dest /var/www/html/index.html
        owner: root
        group: root
        # TODO: mode "0644"

    # notify: loest einen Handler aus, aber nur, wenn diese Aufgabe etwas geaendert hat.
    - name: Nginx-Konfiguration aus Vorlage erzeugen
      ansible.builtin.template:
        # TODO: src templates/site.conf.j2, dest /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      # TODO: notify auf den Handler "Nginx neu laden"

    # service: steuert Dienste. state: started = soll laufen, enabled: true = startet beim Booten.
    - name: Nginx laeuft und startet beim Booten
      ansible.builtin.service:
        name: nginx
        # TODO: state started, enabled true

  # handlers: Aufgaben, die nur auf notify hin laufen, einmal am Ende des Plays, auch bei mehreren notify.
  #           Wozu: Dienst nur neu laden, wenn sich die Konfiguration wirklich geaendert hat.
  handlers:
    - name: Nginx neu laden
      ansible.builtin.service:
        name: nginx
        # TODO: state reloaded

# Zweites Play: Pruefung nach der Einrichtung. Ein Playbook kann mehrere Plays haben, auch fuer
# andere Hosts.
# register: speichert das Ergebnis einer Aufgabe in einer Variable (hier seite).
# when:     fuehrt die Aufgabe nur aus, wenn die Bedingung stimmt.
# uri:      ruft eine URL auf. assert: bricht mit Fehler ab, wenn die Bedingung nicht stimmt.
- name: Ergebnis pruefen
  hosts: web
  # Im Check-Modus aendert sich nichts, also gibt es auch nichts zu pruefen
  tasks:
    - name: Startseite abrufen
      ansible.builtin.uri:
        url: "http://localhost:{{ web_port | default(80) }}/"
        return_content: true
      register: seite
      when: not ansible_check_mode

    # TODO: Task mit ansible.builtin.assert: that: der Hostname (inventory_hostname)
    #       steht im Inhalt der Seite (seite.content). success_msg frei waehlen.
    #       Ebenfalls nur ausfuehren, wenn nicht ansible_check_mode.
