  #   serial: 1

  tasks:
    - name: Nginx installieren
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      # OPTIONAL: Stichwort fuer --tags und eine Bedingung (in die Aufgabe schreiben)
