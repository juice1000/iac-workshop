---
# Lab 3: Webserver einrichten (Uebung)
# Ziel: nginx auf der Gruppe web, Startseite und Konfiguration aus den Vorlagen in templates/
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
# WEGWEISER
# Hauptweg: die Stellen mit TODO. Sie reichen, damit das Lab laeuft.
# NICHT Teil des Hauptwegs: alles, was mit OPTIONAL oder [OPTIONAL] beginnt. Nur zum Vertiefen,
# erst nach dem Hauptweg ansehen.
# Optional in dieser Datei: vars_files und vars_prompt, serial, tags und when, loop, user und
#   file, validate, copy und lineinfile, flush_handlers, command mit changed_when,
#   block/rescue/always, wait_for, no_log, delegate_to, listen, until/retries, Fakten, Befehle.
# PLAY
# Was: ein Abschnitt im Playbook. Er sagt, AUF WELCHEN Servern (hosts) WAS (tasks) passieren soll.
#      Ein Playbook ist eine Liste von Plays. Die Datei ist YAML, Einrueckung zaehlt.
# hosts:  Gruppe aus dem Inventory (hier web).
# become: true = mit sudo ausfuehren. Wozu: Pakete installieren braucht Root-Rechte.
- name: Webserver einrichten
  hosts: web
  become: true

  # vars: Variablen fuer dieses Play, nutzbar mit {{ name }} in Aufgaben und Vorlagen.
  #       Mit -e web_port=8081 auf der Kommandozeile ueberschreibbar (hat Vorrang).
  vars:
    web_port: 80
    begruessung: "Hallo TLBG"
  # OPTIONAL: Variablen aus Datei oder Eingabe
  #   vars_files:
  #     - vars/web.yml
  #   vars_prompt:
  #     - name: begruessung
  #       prompt: "Welche Begruessung?"
  #       private: false
  # OPTIONAL: Ein Server nach dem anderen (in das Play schreiben)
  #   serial: 1

  # tasks: die Aufgaben, die der Reihe nach laufen. Jede Aufgabe ruft ein Modul auf.
  # Ein Modul ist ein fertiger Baustein (apt, template, service ...) mit eigenen Parametern.
  # Module sind idempotent: sie pruefen den Ist-Zustand und aendern nur, wenn er abweicht.
  # Hilfe zu jedem Modul: ansible-doc ansible.builtin.apt
  tasks:
    # apt: installiert Pakete (Debian/Ubuntu). state: present = soll vorhanden sein.
    #      cache_valid_time: Paketliste nur aktualisieren, wenn sie aelter als eine Stunde ist.
    - name: Nginx installieren
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      # OPTIONAL: Stichwort fuer --tags und eine Bedingung (in die Aufgabe schreiben)
      #   tags: [paket]
      #   when: ansible_facts['os_family'] == "Debian"

    # [OPTIONAL] loop: wiederholt die Aufgabe fuer jedes Element, das Element heisst {{ item }}.
    # OPTIONAL: mehrere Pakete mit einer Schleife
    #   - name: Werkzeuge installieren
    #     ansible.builtin.apt:
    #       name: "{{ item }}"
    #       state: present
    #     loop: [curl, vim, htop]
    # OPTIONAL: Benutzer und Verzeichnis anlegen
    #   - name: Benutzer anlegen
    #     ansible.builtin.user:
    #       name: webadmin
    #       shell: /bin/bash
    #       groups: www-data
    #       append: true
    #   - name: Verzeichnis anlegen
    #     ansible.builtin.file:
    #       path: /srv/daten
    #       state: directory
    #       mode: "0755"

    # template: rendert eine Jinja2-Vorlage (*.j2) auf dem Controller und legt das Ergebnis auf dem Server ab.
    #           Wozu: Konfigurationsdateien mit Variablen. Unterschied zu copy: copy kopiert 1:1.
    #           owner, group, mode setzen Besitzer und Rechte.
    - name: Startseite aus Vorlage erzeugen
      ansible.builtin.template:
        src: templates/index.html.j2
        # TODO: dest /var/www/html/index.html
        owner: root
        group: root
        # TODO: mode "0644"

    # OPTIONAL: Datei vor dem Ausrollen pruefen (validate), Beispiel sudoers
    #   - name: sudo-Regel anlegen
    #     ansible.builtin.copy:
    #       content: "webadmin ALL=(ALL) NOPASSWD: ALL\n"
    #       dest: /etc/sudoers.d/webadmin
    #       mode: "0440"
    #       validate: "visudo -cf %s"
    # OPTIONAL: statische Datei kopieren und eine Zeile in einer Datei setzen
    #   - name: Datei kopieren
    #     ansible.builtin.copy:
    #       content: "Hallo\n"
    #       dest: /etc/motd
    #       mode: "0644"
    #   - name: Zeile in Datei setzen
    #     ansible.builtin.lineinfile:
    #       path: /etc/motd
    #       line: "Wartung am Freitag"

    # notify: loest einen Handler aus, aber nur, wenn diese Aufgabe etwas geaendert hat.
    - name: Nginx-Konfiguration aus Vorlage erzeugen
      ansible.builtin.template:
        # TODO: src templates/site.conf.j2, dest /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
      # TODO: notify auf den Handler "Nginx neu laden"

    # OPTIONAL: Handler sofort ausfuehren statt am Ende des Plays
    #   - name: Handler jetzt ausfuehren
    #     ansible.builtin.meta: flush_handlers

    # service: steuert Dienste. state: started = soll laufen, enabled: true = startet beim Booten.
    - name: Nginx laeuft und startet beim Booten
      ansible.builtin.service:
        name: nginx
        # TODO: state started, enabled true

    # [OPTIONAL] command / shell: fuehren ein Kommando aus. Sie kennen den Soll-Zustand nicht und melden immer changed.
    #                  Deshalb: changed_when steuert die Meldung, und wenn moeglich ein Modul nehmen.
    # debug: gibt Werte aus. Wozu: nachsehen, was in einer Variable steht.
    # OPTIONAL: command meldet immer "changed". Mit changed_when steuert man das.
    #   - name: Nginx-Version lesen
    #     ansible.builtin.command: nginx -v
    #     register: nginx_version
    #     changed_when: false
    #   - name: Version anzeigen
    #     ansible.builtin.debug:
    #       msg: "{{ nginx_version.stderr }}"
    # [OPTIONAL] block / rescue / always: fasst Aufgaben zusammen.
    #   rescue laeuft nur bei einem Fehler im block, always immer. Wozu: Fehler abfangen und aufraeumen.
    # OPTIONAL: Fehlerbehandlung mit block, rescue und always
    #   - name: Mit Fehlerbehandlung
    #     block:
    #       - name: Kann fehlschlagen
    #         ansible.builtin.command: /bin/false
    #     rescue:
    #       - name: Wird bei Fehler ausgefuehrt
    #         ansible.builtin.debug:
    #           msg: "Fehler abgefangen"
    #     always:
    #       - name: Immer
    #         ansible.builtin.debug:
    #           msg: "fertig"
    # [OPTIONAL] wait_for: wartet auf einen Port oder eine Datei. Wozu: erst weitermachen, wenn ein Dienst bereit ist.
    # OPTIONAL: Wartet, bis der Port offen ist
    #   - name: Auf Port warten
    #     ansible.builtin.wait_for:
    #       port: "{{ web_port }}"
    #       timeout: 30
      # OPTIONAL: Passwoerter nicht ins Log schreiben (in die Aufgabe schreiben)
      #   no_log: true
    # OPTIONAL: Aufgabe nur einmal und auf dem eigenen Rechner ausfuehren
    #   - name: Zeitstempel auf dem eigenen Rechner
    #     ansible.builtin.command: date
    #     delegate_to: localhost
    #     become: false             # auf dem eigenen Rechner kein sudo
    #     run_once: true
    #     changed_when: false

  # handlers: Aufgaben, die nur auf notify hin laufen, einmal am Ende des Plays, auch bei mehreren notify.
  #           Wozu: Dienst nur neu laden, wenn sich die Konfiguration wirklich geaendert hat.
  handlers:
    - name: Nginx neu laden
      ansible.builtin.service:
        name: nginx
        # TODO: state reloaded
      # OPTIONAL: mehrere Handler auf dasselbe Stichwort
      #   listen: "web neu laden"

# Zweites Play: Pruefung nach der Einrichtung. Ein Playbook kann mehrere Plays haben, auch fuer
# andere Hosts.
# register: speichert das Ergebnis einer Aufgabe in einer Variable (hier seite).
# when:     fuehrt die Aufgabe nur aus, wenn die Bedingung stimmt.
# uri:      ruft eine URL auf. assert: bricht mit Fehler ab, wenn die Bedingung nicht stimmt.
- name: Ergebnis pruefen
  hosts: web
  # Im Check-Modus aendert sich nichts, also gibt es auch nichts zu pruefen
  tasks:
    - name: Startseite abrufen
      ansible.builtin.uri:
        url: "http://localhost:{{ web_port | default(80) }}/"
        return_content: true
      register: seite
      when: not ansible_check_mode
      # OPTIONAL: wiederholen, bis der Server antwortet (in die Aufgabe schreiben)
      #   until: seite.status == 200
      #   retries: 5
      #   delay: 2

    # TODO: Task mit ansible.builtin.assert: that: der Hostname (inventory_hostname)
    #       steht im Inhalt der Seite (seite.content). success_msg frei waehlen.
    #       Ebenfalls nur ausfuehren, wenn nicht ansible_check_mode.
    # OPTIONAL: Fakten anzeigen
    #   - name: Betriebssystem anzeigen
    #     ansible.builtin.debug:
    #       var: ansible_facts['distribution']

