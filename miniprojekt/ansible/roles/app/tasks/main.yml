---
# roles/app/tasks/main.yml: richtet den Anwendungsserver (app1) ein.
#
# Ziel: Am Ende laeuft eine kleine Python-Anwendung als Dienst, die Besuche in der Datenbank auf db1 zaehlt.
# Ablauf: Treiber fuer PostgreSQL installieren, eigenen Benutzer und Verzeichnis anlegen, drei Dateien aus
# Vorlagen ausrollen (Anwendung, Zugangsdaten, systemd-Dienstdatei), Dienst starten. Aendert sich eine der drei
# Dateien, startet der Handler die Anwendung neu (notify).
# Woher die Werte kommen: app_user, app_dir aus defaults/main.yml, db_host und app_port aus dem Inventory
# (Terraform schreibt sie), db_name, db_user, db_password aus group_vars/all.yml.
# Mehr Hintergrund: README.md im Ordner miniprojekt/ansible.
- name: Python-Treiber fuer PostgreSQL installieren
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

# user: legt Benutzer an. system: true = Systemkonto. Wozu: die Anwendung laeuft mit eigenen,
#       minimalen Rechten (keine Shell, kein Home) statt als root.
- name: Systembenutzer fuer die Anwendung anlegen
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# file: legt Dateien, Verzeichnisse oder Links an, setzt Rechte. state: directory = Verzeichnis.
- name: Anwendungsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Die Anwendung kommt per Vorlage aufs Ziel. notify startet sie neu, wenn sich die Datei geaendert hat.
- name: Anwendung ausrollen
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ app_dir }}/app.py"
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten

- name: Datenbankverbindung konfigurieren
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/tlbg-app.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Anwendung neu starten

- name: Systemd-Dienst anlegen
  ansible.builtin.template:
    src: tlbg-app.service.j2
    dest: /etc/systemd/system/tlbg-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten

# systemd_service: steuert Dienste mit systemd. daemon_reload liest die Dienstdateien neu ein,
# das ist noetig, nachdem tlbg-app.service neu angelegt oder geaendert wurde.
- name: Anwendung laeuft und startet beim Booten
  ansible.builtin.systemd_service:
    name: tlbg-app
    state: started
    enabled: true
    daemon_reload: true
