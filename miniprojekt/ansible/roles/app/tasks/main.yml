---
# Phase 3: Rolle app. Hilfe: ansible-doc <modulname>
# Die Vorlagen in templates/ und der Handler in handlers/ sind schon fertig.
# Die ersten beiden Aufgaben sind als Beispiel fertig. Ergaenzt die Stellen mit TODO.
- name: Python-Treiber fuer PostgreSQL installieren
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Systembenutzer fuer die Anwendung anlegen
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    # TODO: keine Login-Shell (/usr/sbin/nologin) und kein Home-Verzeichnis

- name: Anwendungsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ app_dir }}"
    # TODO: state directory, Besitzer root, Gruppe root, Rechte 0755

- name: Anwendung ausrollen
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ app_dir }}/app.py"
    # TODO: Besitzer root, Gruppe root, Rechte 0644
  # TODO: notify "Anwendung neu starten"

# TODO: Vorlage app.env.j2 nach /etc/tlbg-app.env
#       Besitzer root, Gruppe {{ app_user }}, Rechte 0640 (enthaelt das Passwort!), notify wie oben

# TODO: Vorlage tlbg-app.service.j2 nach /etc/systemd/system/tlbg-app.service, notify wie oben

# TODO: Dienst tlbg-app starten und aktivieren, vorher systemd neu laden
#       (ansible.builtin.systemd_service, daemon_reload: true)

#
# OPTIONAL / GUT ZU WISSEN
# - Reihenfolge: erst Benutzer und Verzeichnis, dann Dateien, dann Dienst.
# - Rechte 0640 mit Gruppe der Anwendung: nur die App und root lesen das Passwort.
# - Idempotenz pruefen: zweiter Lauf muss changed=0 zeigen.
# - ansible.builtin.uri mit until, retries und delay wartet, bis die Anwendung antwortet.
# - ansible.builtin.wait_for wartet auf einen Port.
# - Dienst haerten (systemd): NoNewPrivileges, ProtectSystem, PrivateTmp in der Service-Datei.
# - Health-Check als eigene Aufgabe am Ende: Antwort muss "DB OK" enthalten (assert).
# - delegate_to: localhost fuer Pruefungen vom Controller aus.
