# Phase 3: Rolle app
# Ersetzt die leere Liste unten durch eure Tasks. Hilfe: ansible-doc <modulname>
# Die Vorlagen in templates/ und der Handler in handlers/ sind schon fertig.
#
# 1. Paket python3-psycopg2 installieren (ansible.builtin.apt)
# 2. Systembenutzer {{ app_user }} ohne Login-Shell und ohne Home anlegen
#    (ansible.builtin.user)
# 3. Verzeichnis {{ app_dir }} anlegen (ansible.builtin.file)
# 4. Vorlage app.py.j2 nach {{ app_dir }}/app.py ausrollen (ansible.builtin.template)
# 5. Vorlage app.env.j2 nach /etc/tlbg-app.env ausrollen,
#    Besitzer root, Gruppe {{ app_user }}, Rechte 0640 (enthaelt das Passwort!)
# 6. Vorlage tlbg-app.service.j2 nach /etc/systemd/system/tlbg-app.service ausrollen
#    -> Schritte 4 bis 6 mit notify: Anwendung neu starten
# 7. Dienst tlbg-app starten und aktivieren, vorher systemd neu laden
#    (ansible.builtin.systemd_service mit daemon_reload: true)
#
# OPTIONAL / GUT ZU WISSEN
# - Reihenfolge: erst Benutzer und Verzeichnis, dann Dateien, dann Dienst.
# - Rechte 0640 mit Gruppe der Anwendung: nur die App und root lesen das Passwort.
# - Idempotenz pruefen: zweiter Lauf muss changed=0 zeigen.
# - ansible.builtin.uri mit until, retries und delay wartet, bis die Anwendung antwortet.
# - ansible.builtin.wait_for wartet auf einen Port.
# - Dienst haerten (systemd): NoNewPrivileges, ProtectSystem, PrivateTmp in der Service-Datei.
# - Health-Check als eigene Aufgabe am Ende: Antwort muss "DB OK" enthalten (assert).
# - delegate_to: localhost fuer Pruefungen vom Controller aus.
