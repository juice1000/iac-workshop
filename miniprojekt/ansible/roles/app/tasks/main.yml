---
- name: Python-Treiber fuer PostgreSQL installieren
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Systembenutzer fuer die Anwendung anlegen
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Anwendungsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Anwendung ausrollen
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ app_dir }}/app.py"
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten

- name: Datenbankverbindung konfigurieren
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/tlbg-app.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Anwendung neu starten

- name: Systemd-Dienst anlegen
  ansible.builtin.template:
    src: tlbg-app.service.j2
    dest: /etc/systemd/system/tlbg-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten

- name: Anwendung laeuft und startet beim Booten
  ansible.builtin.systemd_service:
    name: tlbg-app
    state: started
    enabled: true
    daemon_reload: true
