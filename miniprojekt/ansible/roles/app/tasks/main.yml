---
# Phase 3: Rolle app. Hilfe: ansible-doc <modulname>
# Die Vorlagen in templates/ und der Handler in handlers/ sind schon fertig.
# Die ersten beiden Aufgaben sind als Beispiel fertig. Geloeste Version, alles ausgefuellt.
# Zeilen mit "#   " (Raute und drei Leerzeichen) sind Code zum Einkommentieren.
# GELOESTE VERSION von practice: alle TODOs sind ausgefuellt, die optionalen Beispiele sind aktiv.
# Beispiele mit [NICHT AKTIV] bleiben bewusst auskommentiert, der Grund steht dabei.
# Optional in dieser Datei: no_log, Dienst haerten, uri mit until und assert, delegate_to.
- name: Python-Treiber fuer PostgreSQL installieren
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

# user: legt Benutzer an. system: true = Systemkonto. Wozu: die Anwendung laeuft mit eigenen,
#       minimalen Rechten (keine Shell, kein Home) statt als root.
- name: Systembenutzer fuer die Anwendung anlegen
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# file: legt Dateien, Verzeichnisse oder Links an, setzt Rechte. state: directory = Verzeichnis.
- name: Anwendungsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Die Anwendung kommt per Vorlage aufs Ziel. notify startet sie neu, wenn sich die Datei geaendert hat.
- name: Anwendung ausrollen
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ app_dir }}/app.py"
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten

- name: Datenbankverbindung konfigurieren
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/tlbg-app.env
    owner: root
    group: "{{ app_user }}"
    mode: "0640"
  notify: Anwendung neu starten
  no_log: true # die Datei enthaelt das Passwort
# OPTIONAL: Datei nicht im Log zeigen (in die Aufgabe schreiben)
# Aktiv: no_log steht oben bei der Aufgabe.

- name: Systemd-Dienst anlegen
  ansible.builtin.template:
    src: tlbg-app.service.j2
    dest: /etc/systemd/system/tlbg-app.service
    owner: root
    group: root
    mode: "0644"
  notify: Anwendung neu starten
# OPTIONAL: Dienst haerten, in der Vorlage tlbg-app.service.j2 unter [Service]:
# Aktiv: NoNewPrivileges, ProtectSystem und PrivateTmp stehen in templates/tlbg-app.service.j2.

# systemd_service: steuert Dienste mit systemd. daemon_reload liest die Dienstdateien neu ein,
# das ist noetig, nachdem tlbg-app.service neu angelegt oder geaendert wurde.
- name: Anwendung laeuft und startet beim Booten
  ansible.builtin.systemd_service:
    name: tlbg-app
    state: started
    enabled: true
    daemon_reload: true

# OPTIONAL: Warten, bis die Anwendung antwortet, und das Ergebnis pruefen
- name: Auf die Anwendung warten
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/"
    return_content: true
  register: app_antwort
  until: app_antwort.status == 200
  retries: 10
  delay: 2
  when: not ansible_check_mode

- name: Datenbankverbindung pruefen
  ansible.builtin.assert:
    that: "'DB OK' in app_antwort.content"
    success_msg: "Anwendung erreicht die Datenbank"
  when: not ansible_check_mode
# OPTIONAL: Pruefung vom Controller aus
# [NICHT AKTIV] delegate_to: localhost trifft nur zu, wenn der App-Port auf dem Controller veroeffentlicht ist (Docker). Bei VMs nicht.
