---
# Phase 2: Rolle postgresql
# Ersetzt die leere Liste unten durch eure Tasks. Hilfe: ansible-doc <modulname>
#
# 1. Pakete postgresql und python3-psycopg2 installieren (ansible.builtin.apt)
# 2. In {{ postgresql_conf_dir }}/postgresql.conf die Zeile
#    listen_addresses = '*' setzen (ansible.builtin.lineinfile)
#    -> danach muss PostgreSQL neu starten (notify: PostgreSQL neu starten)
# 3. In {{ postgresql_conf_dir }}/pg_hba.conf nur {{ db_user }} auf {{ db_name }}
#    aus dem Netz {{ postgresql_erlaubtes_netz }} mit scram-sha-256 erlauben
#    (community.postgresql.postgresql_pg_hba), ebenfalls mit notify
# 4. Dienst postgresql starten und beim Booten aktivieren (ansible.builtin.service)
# 5. Datenbankbenutzer {{ db_user }} mit Passwort {{ db_password }} anlegen
#    (community.postgresql.postgresql_user, als Benutzer postgres:
#    become: true und become_user: postgres, no_log: true)
# 6. Datenbank {{ db_name }} mit Besitzer {{ db_user }} anlegen
#    (community.postgresql.postgresql_db, ebenfalls als postgres)
