---
# Phase 2: Rolle postgresql. Hilfe: ansible-doc <modulname>
# Die erste Aufgabe ist als Beispiel fertig. Ergaenzt die Stellen mit TODO.
- name: PostgreSQL und Python-Treiber installieren
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Auf allen Netzwerkschnittstellen lauschen
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses"
    # TODO: line "listen_addresses = '*'"
  notify: PostgreSQL neu starten

- name: Zugriff nur aus dem Anwendungsnetz erlauben
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    contype: host
    # TODO: databases {{ db_name }}, users {{ db_user }}
    # TODO: address {{ postgresql_erlaubtes_netz }}, method scram-sha-256
  notify: PostgreSQL neu starten

# TODO: Dienst postgresql starten und beim Booten aktivieren (ansible.builtin.service)

- name: Datenbankbenutzer anlegen
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    # TODO: password {{ db_password }}
  # TODO: als Benutzer postgres ausfuehren (become und become_user)
  # TODO: das Passwort darf nicht im Log erscheinen (no_log)

# TODO: Datenbank {{ db_name }} mit Besitzer {{ db_user }} anlegen
#       (community.postgresql.postgresql_db, ebenfalls als Benutzer postgres)

#
# OPTIONAL / GUT ZU WISSEN
# - Die pg_hba.conf wird von oben nach unten ausgewertet. Die erste passende Zeile gilt.
# - scram-sha-256 ist der moderne Standard, md5 ist veraltet, trust sollte man nie nutzen.
# - Weitere Module in community.postgresql: postgresql_privs, postgresql_ext, postgresql_query, postgresql_set.
# - Neustart gegen Reload: listen_addresses braucht Neustart, pg_hba.conf nur Reload.
# - no_log: true verhindert, dass Passwoerter im Log landen. Auch mit -vvv.
# - Passwoerter gehoeren in Ansible Vault, nicht in group_vars im Klartext.
# - Backups: pg_dump per cron oder systemd-Timer, Wiederherstellung testen.
# - Bei Cloud-Betrieb: Security Group erlaubt Port 5432 nur aus dem App-Netz (siehe docs/03-architecture.md).
