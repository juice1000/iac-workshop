---
# roles/postgresql/tasks/main.yml: richtet den Datenbankserver (db1) ein.
#
# Ziel: Am Ende laeuft PostgreSQL so, dass die Anwendung von einem anderen Server (app1) aus eine
# Verbindung aufbauen darf, aber sonst niemand. Direkt nach der Installation geht das nicht, drei Dinge fehlen:
#   1. PostgreSQL lauscht nur auf 127.0.0.1, also nur fuer Programme auf db1 selbst.  -> lineinfile
#   2. Die Zugriffsregeln (pg_hba.conf) lassen niemanden von aussen herein.             -> postgresql_pg_hba
#   3. Es gibt noch keinen Benutzer und keine Datenbank fuer die Anwendung.            -> postgresql_user, postgresql_db
# Reihenfolge: installieren, lauschen, Zugriffsregel, Dienst starten, Benutzer, Datenbank. Benutzer und Datenbank
# kommen nach dem Start, weil die Module sich mit der laufenden Datenbank verbinden.
# Woher die Werte kommen: db_name, db_user, db_password aus group_vars/all.yml, app_netz aus dem Inventory
# (ueber postgresql_erlaubtes_netz), Pfade und Version aus defaults/main.yml.
# Checkpoint: ansible-playbook site.yml --limit db, danach ansible-playbook pruefen.yml --tags db
# Mehr Hintergrund: README.md im Ordner miniprojekt/ansible.
- name: PostgreSQL und Python-Treiber installieren
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
    state: present
    update_cache: true
    cache_valid_time: 3600

# lineinfile: stellt sicher, dass eine Zeile in einer Datei so steht. regexp findet die alte Zeile,
#             line ersetzt sie. Wozu: einzelne Einstellung aendern, ohne die ganze Datei zu besitzen.
# Hier: postgresql.conf ist eine lange Datei des Pakets, wir aendern nur listen_addresses. Standard ist
# 'localhost' (nur Programme auf diesem Server). '*' heisst: auf allen Schnittstellen lauschen, damit app1
# ueber das Netz ankommt. Das "#?" im regexp trifft die Zeile auch auskommentiert, so wie sie ausgeliefert wird.
# '*' oeffnet nur die Tuer, wer hindurch darf regelt die naechste Aufgabe (pg_hba.conf).
- name: Auf allen Netzwerkschnittstellen lauschen
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
  notify: PostgreSQL neu starten

# pg_hba.conf: Zugriffsregeln von PostgreSQL (wer darf von wo auf welche Datenbank mit welcher
# Anmeldung). Das Modul postgresql_pg_hba pflegt einzelne Zeilen. Wozu: die Datenbank nur dem
# Anwendungsnetz oeffnen, nicht der ganzen Welt.
- name: Zugriff nur aus dem Anwendungsnetz erlauben
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    contype: host
    databases: "{{ db_name }}"
    users: "{{ db_user }}"
    address: "{{ postgresql_erlaubtes_netz }}"
    method: scram-sha-256
  notify: PostgreSQL neu starten

# Die pg_hba.conf wird von oben nach unten gelesen, die erste passende Zeile gilt.
# listen_addresses braucht einen Neustart, pg_hba.conf nur ein Reload.
- name: PostgreSQL laeuft und startet beim Booten
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# become_user: postgres fuehrt die Aufgabe als Datenbank-Administrator aus (sudo -u postgres).
# no_log: true unterdrueckt die Ausgabe der Aufgabe, damit das Passwort nicht im Log landet.
# Die Module postgresql_user und postgresql_db sind idempotent: sie legen nur an, was fehlt.
- name: Datenbankbenutzer anlegen
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
  become: true
  become_user: postgres
  no_log: true

- name: Datenbank anlegen
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
  become: true
  become_user: postgres
