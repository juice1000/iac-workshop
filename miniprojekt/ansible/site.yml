---
# site.yml: das Haupt-Playbook des Miniprojekts. Aufruf: ansible-playbook site.yml
# Reihenfolge: erst die Datenbank (die Anwendung braucht sie beim Start), dann die Anwendung, dann ein
# Smoke-Test (ein kurzer Test, ob das Ganze funktioniert) und zuletzt das Einsammeln der Ergebnisse in out/.
# hosts: app und db sind Gruppen aus inventory.ini (Terraform erzeugt die Datei).
# Hintergrund und Erklaerung der Rollen: README.md in diesem Ordner.

# TODO: Schreibt die ersten beiden Plays. Jeder Play braucht name, hosts, become und roles:
#   Play 1  Datenbankserver einrichten   hosts: db    Rolle postgresql
#   Play 2  Anwendungsserver einrichten  hosts: app   Rolle app
# Beide mit become: true (Root-Rechte). Die Datenbank kommt zuerst, weil die Anwendung sie beim Start braucht.
# Muster:  lab05-ansible-rolle/site.yml (dort ruft ein Play eine Rolle auf)
# Hilfe:   Die Gruppen db und app stehen in inventory.ini (Terraform hat sie erzeugt). roles: ist eine Liste.

- name: Smoke-Test
  hosts: app
  tasks:
    # TODO: Schreibt die beiden Aufgaben des Smoke-Tests:
    #   1. Anwendung abrufen: Modul uri, url http://localhost:{{ app_port }}/, return_content: true, Ergebnis mit
    #      register in der Variable antwort speichern (wird unten weiterverwendet). Die Anwendung braucht nach dem
    #      Start einen Moment: retries 5, delay 2, until antwort.status == 200.
    #   2. Pruefen: Modul assert, that: "'DB OK' in antwort.content", success_msg ist die Antwort ohne Leerzeichen
    #      am Rand ({{ antwort.content | trim }}).
    # Muster: lab03-ansible-grundlagen/playbook.yml, zweites Play (uri, register, assert)
    # Hilfe:  ansible-doc ansible.builtin.uri, ansible-doc ansible.builtin.assert

    # delegate_to: localhost fuehrt eine Aufgabe auf eurem Rechner aus statt auf dem Server.
    # Zuerst muss der Ordner out/ existieren, denn copy legt keine Ordner an.
    - name: Ordner out/ anlegen
      ansible.builtin.file:
        path: "{{ playbook_dir }}/out"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # Die Antwort der Anwendung landet in out/antwort.txt, damit ihr sie ansehen koennt.
    # regex_replace schneidet den Besuchszaehler ab. Er waechst bei jedem Abruf, die Datei wuerde sonst
    # bei jedem Lauf "changed" melden und der zweite Lauf waere nicht mehr changed=0.
    - name: Antwort der Anwendung in out/ ablegen
      ansible.builtin.copy:
        content: "{{ antwort.content | trim | regex_replace(', Besuche: [0-9]+$', '') }}\n"
        dest: "{{ playbook_dir }}/out/antwort.txt"
        mode: "0644"
      delegate_to: localhost

# Ergebnisse einsammeln: Ansible holt Dateien und Auskuenfte von den Servern in den Ordner out/ neben
# diesem Playbook (nicht im Git). So seht ihr, was die Rollen auf den Servern bewirkt haben:
#   out/<server>/etc/postgresql/16/main/pg_hba.conf   Zugriffsregel der Datenbank (nur die App darf rein)
#   out/<server>/etc/systemd/system/tlbg-app.service   Dienstdatei der Anwendung
#   out/<server>/ports.txt                             welche Ports auf dem Server lauschen (5432, 8080)
#   out/antwort.txt                                    Antwort der Anwendung (siehe Smoke-Test)
# fetch ist das Gegenstueck zu copy: Server -> Rechner. Es ist idempotent (gleicher Inhalt = ok).
- name: Ergebnisse in out/ sammeln
  hosts: all
  tasks:
    - name: Zugriffsregeln der Datenbank holen
      ansible.builtin.fetch:
        src: /etc/postgresql/16/main/pg_hba.conf
        dest: "{{ playbook_dir }}/out/"
      when: "'db' in group_names"

    - name: Dienstdatei der Anwendung holen
      ansible.builtin.fetch:
        src: /etc/systemd/system/tlbg-app.service
        dest: "{{ playbook_dir }}/out/"
      when: "'app' in group_names"

    # ss -tln listet alle Ports im Zustand LISTEN (lauscht auf Verbindungen).
    # changed_when: false, weil das reine Abfragen nichts am Server aendert.
    - name: Lauschende Ports abfragen
      ansible.builtin.command: ss -tln
      register: ports
      changed_when: false

    - name: Ordner pro Server in out/ anlegen
      ansible.builtin.file:
        path: "{{ playbook_dir }}/out/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Ports in out/ ablegen
      ansible.builtin.copy:
        content: "{{ ports.stdout }}\n"
        dest: "{{ playbook_dir }}/out/{{ inventory_hostname }}/ports.txt"
        mode: "0644"
      delegate_to: localhost
