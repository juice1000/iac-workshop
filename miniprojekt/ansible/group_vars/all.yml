# group_vars/all.yml: Variablen fuer alle Server. Ansible liest group_vars/<gruppe>.yml automatisch, "all" gilt
# fuer jeden Host. Diese drei Werte brauchen beide Rollen: postgresql legt Benutzer und Datenbank an,
# app traegt sie in /etc/tlbg-app.env ein, damit die Anwendung sich anmelden kann.
db_name: tlbg_app
db_user: tlbg_app
